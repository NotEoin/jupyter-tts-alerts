[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jupyter-tts-alerts"
dynamic = ["version"]
description = "Your Jupyter notebook says out loud when a long cell finishes, how long it took, and whether it crashed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NotEoin" }]
keywords = [
    "jupyter",
    "ipython",
    "notebook",
    "tts",
    "text-to-speech",
    "speech",
    "alerts",
    "notifications",
    "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
# Nothing. The package is pure standard library and never imports IPython at
# module scope: IPython is the host it plugs into, not a library it consumes,
# and it is present by definition anywhere this package does anything at all.
dependencies = []

[project.optional-dependencies]
# For anyone who would rather have the host pinned explicitly.
notebook = ["ipython>=8.0"]
test = [
    "ipython>=8.0",
    "pytest>=7.0",
    "nbclient>=0.7",
    "nbformat>=5.0",
    "ipykernel>=6.29",   # nbclient does not depend on it, so no kernel without
]
dev = [
    "jupyter-tts-alerts[test]",
    "build>=1.0",
    "twine>=7.0",        # 6.x rejects the Metadata-Version 2.5 hatchling now emits
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/NotEoin/jupyter-tts-alerts"
Repository = "https://github.com/NotEoin/jupyter-tts-alerts"
Issues = "https://github.com/NotEoin/jupyter-tts-alerts/issues"

[tool.hatch.version]
path = "src/jupyter_tts_alerts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_tts_alerts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/notebooks",
    "/media",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
